<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORVUS</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <div class="brand">
    <div class="mark">◆</div>
    <div>
      <h1>CORVUS</h1>
      <small>LOCAL INTELLIGENCE</small>
    </div>
  </div>

  <div class="status">
    <i></i>
    NORMAL
  </div>
</header>

<main>
  <section class="chat">
    <div class="welcome">
      <div class="raven"><img src="assets/corvus-emblem.png" alt="CORVUS emblem"></div>
      <h2>CORVUS</h2>
      <p>Local intelligence ready.</p>
    </div>

    <div class="messages">
      <div class="message corvus">
        Systems operational. What are we working on?
      </div>
    </div>

    <form class="composer">
      <textarea placeholder="Message CORVUS..." rows="1"></textarea>
      <button type="button">↑</button>
    </form>
  </section>
</main>

<nav>
  <button class="active"><b>◉</b><span>Chat</span></button>
  <button><b>▤</b><span>Library</span></button>
  <button><b>◇</b><span>Study</span></button>
  <button><b>⚙</b><span>Tools</span></button>
</nav>
</body>
</html>
