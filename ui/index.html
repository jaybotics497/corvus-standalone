<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORVUS</title>
<link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0b0d0e">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
<header>
  <div class="brand">
    <div class="mark">◆</div>
    <div>
      <h1>CORVUS</h1>
      <small>LOCAL INTELLIGENCE</small>
    </div>
  </div>

  <div class="status">
    <i></i>
    NORMAL
  </div>
</header>

<main>
  <section class="chat">
    <div class="welcome">
      <div class="raven-mark" aria-hidden="true"></div>
      <h2>CORVUS</h2>
      <p>PRIVATE · LOCAL · READY</p>
    </div>

    <div class="messages">
      <div class="message corvus">
        <small>CORVUS</small>
        Systems operational. What are we working on?
      </div>
    </div>

    <form class="composer">
      <textarea placeholder="Message CORVUS..." rows="1"></textarea>
      <button type="button">↑</button>
    </form>
  </section>
</main>

<nav aria-label="Primary navigation">
  <button class="active" type="button" aria-current="page"><b>◉</b><span>Chat</span></button>
  <button type="button"><b>▤</b><span>Library</span></button>
  <button type="button"><b>◇</b><span>Study</span></button>
  <button type="button"><b>⚙</b><span>Tools</span></button>
</nav>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</body>
</html>
